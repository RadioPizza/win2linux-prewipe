name: PowerShell Syntax Check

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/**.ps1'
      - '.github/workflows/powershell-lint.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'scripts/**.ps1'
      - '.github/workflows/powershell-lint.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          # Установить модуль для текущего пользователя без подтверждений
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck

          # Запустить анализ только с ошибками (Error) — падение только при реальных проблемах
          $results = Invoke-ScriptAnalyzer -Path ./scripts -Recurse -Severity Error

          if ($results) {
              $results | Format-Table -AutoSize
              Write-Host "::error::PowerShell syntax errors found"
              exit 1
          } else {
              Write-Host "No syntax errors found."
          }
